name: Release

# 推送 v* 标签（如 v1.0.0）时：构建未签名 IPA，按 docs/release-notes/<标签>.md 发布 GitHub Release。
# 应用内「检查更新」读取 Releases 里第一个 .ipa 附件。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v1.0.0，需已存在）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION=$(grep -m1 'MARKETING_VERSION' Cloudn.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);/\1/')
          echo "tag=$TAG marketing=$VERSION"
          [ "v$VERSION" = "$TAG" ] || { echo "::error::标签 $TAG 与 MARKETING_VERSION $VERSION 不一致"; exit 1; }
          [ -f "docs/release-notes/$TAG.md" ] || { echo "::error::缺少 docs/release-notes/$TAG.md"; exit 1; }
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -project Cloudn.xcodeproj -scheme Cloudn -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cloudn.app Payload/
          zip -qry "Cloudn-${{ steps.tag.outputs.tag }}.ipa" Payload
          shasum -a 256 "Cloudn-${{ steps.tag.outputs.tag }}.ipa" | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Cloudn-$TAG.ipa" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "docs/release-notes/$TAG.md"
          else
            gh release create "$TAG" "Cloudn-$TAG.ipa" SHA256SUMS.txt \
              --title "Cloudn ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
